name: 데이터 기반 블로그 글 자동 생성 (PR)

# 주 3회(월/수/금) 한국시간(KST, UTC+9) 오전 8시 = UTC 23:00(일/화/목) 실행.
on:
  schedule:
    - cron: "0 23 * * 0,2,4"
  workflow_dispatch:
    inputs:
      month:
        description: "분석할 월 (YYYYMM). 비워두면 지난달을 자동으로 사용"
        required: false
        default: ""
      region:
        description: "분석할 지역. auto면 이번 주 로테이션 지역 (지역 코드 이상이면 로테이션 다음 지역으로 자동 대체)"
        type: choice
        required: false
        default: auto
        options: [auto, seoul, gyeonggi, incheon, busan, daegu, daejeon, gwangju]

permissions:
  contents: write
  pull-requests: write
  issues: write  # 글이 생성되지 않은 날 사유를 Issue로 남기기 위함

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치 (차트용)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-nanum

      - name: 파이썬 의존성 설치
        run: pip install -r pipeline/requirements.txt

      - name: 콘텐츠 생성
        id: generate
        env:
          DATA_GO_KR_ENCODING_KEY: ${{ secrets.DATA_GO_KR_ENCODING_KEY }}
          DATA_GO_KR_DECODING_KEY: ${{ secrets.DATA_GO_KR_DECODING_KEY }}
          MONTH_INPUT: ${{ github.event.inputs.month }}
          REGION_INPUT: ${{ github.event.inputs.region }}
          PYTHONUNBUFFERED: "1"
        run: |
          # pipefail이 없으면 `python ... | tee`의 종료 코드가 tee(항상 0)로 덮여서,
          # 파이썬이 크래시해도 "성공"으로 끝나 버린다 (2026-10-16 #16 실행에서 실제로 발생).
          # 종료 코드는 여기서 실패시키지 않고 출력으로 넘겨, 알림(Issue)을 만든 뒤 마지막 스텝에서 실패 처리한다.
          set +e
          set -o pipefail
          ARGS=()
          [ -n "$MONTH_INPUT" ] && ARGS+=(--month "$MONTH_INPUT")
          [ -n "$REGION_INPUT" ] && [ "$REGION_INPUT" != "auto" ] && ARGS+=(--region "$REGION_INPUT")
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::생성 시도 ${attempt}/${MAX_ATTEMPTS}"
            python pipeline/generate_post.py "${ARGS[@]}" 2>&1 | tee generate_output.log
            code=$?
            echo "::endgroup::"
            # 종료 코드 3 = 공공데이터 API 일시 장애. 그 외(성공/주제 없음/코드 오류)는 재시도해도 같으므로 중단.
            if [ "$code" -ne 3 ] || [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi
            echo "::warning::공공데이터 API 접속 실패 (시도 ${attempt}/${MAX_ATTEMPTS}). 5분 후 다시 시도합니다."
            sleep 300
          done
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempt" >> "$GITHUB_OUTPUT"

      - name: 생성 결과 파싱
        id: meta
        if: always()
        env:
          EXIT_CODE: ${{ steps.generate.outputs.exit_code }}
        run: |
          touch generate_output.log
          if [ "$EXIT_CODE" = "0" ] && grep -q '^::post-meta::' generate_output.log; then
            META_JSON="$(grep '^::post-meta::' generate_output.log | sed 's/^::post-meta:://')"
            {
              echo "found=true"
              echo "title=$(echo "$META_JSON" | jq -r .title)"
              echo "summary=$(echo "$META_JSON" | jq -r .summary)"
              echo "slug=$(echo "$META_JSON" | jq -r .slug)"
              echo "path=$(echo "$META_JSON" | jq -r .path)"
              echo "data_period=$(echo "$META_JSON" | jq -r .data_period)"
              echo "region_note=$(echo "$META_JSON" | jq -r '.region_note // ""')"
            } >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" = "0" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_topic" >> "$GITHUB_OUTPUT"
            echo "::warning::발행할 만한 주제가 없어 PR을 생성하지 않습니다 (사유는 Issue로 남깁니다)."
          elif [ "$EXIT_CODE" = "3" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "reason=api_error" >> "$GITHUB_OUTPUT"
            echo "::error::공공데이터 API 오류로 글을 생성하지 못했습니다."
          elif [ -z "$EXIT_CODE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_error" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "reason=pipeline_error" >> "$GITHUB_OUTPUT"
            echo "::error::콘텐츠 생성 스크립트가 오류(exit=${EXIT_CODE:-미실행})로 종료됐습니다."
          fi

      - name: 브랜치 생성 및 커밋
        if: steps.meta.outputs.found == 'true'
        id: branch
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
          POST_PATH: ${{ steps.meta.outputs.path }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          KST_DATE="$(date -u -d '+9 hours' +%F)"
          BRANCH="post/${KST_DATE}-${SLUG}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git add "$POST_PATH"
          # 건강 점검이 확실한 새 코드를 자동 반영했으면 regions.json도 같은 PR로 올려 검수받는다.
          git add pipeline/regions.json
          git commit -m "글 자동 생성: $TITLE"
          git push origin "$BRANCH"

      - name: PR 본문 작성
        if: steps.meta.outputs.found == 'true'
        env:
          TITLE: ${{ steps.meta.outputs.title }}
          SUMMARY: ${{ steps.meta.outputs.summary }}
          DATA_PERIOD: ${{ steps.meta.outputs.data_period }}
          REGION_NOTE: ${{ steps.meta.outputs.region_note }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## 자동 생성된 글 (발행 전 검수 필요)"
            echo
            echo "- **제목**: $TITLE"
            echo "- **요약**: $SUMMARY"
            echo "- **사용한 데이터 기간**: $DATA_PERIOD"
            if [ -n "$REGION_NOTE" ]; then
              echo "- **지역 대체**: $REGION_NOTE (지역 코드 건강 점검 Issue 참고)"
            fi
            if ! git diff --quiet origin/main -- pipeline/regions.json 2>/dev/null; then
              echo "- **regions.json 변경 포함**: 건강 점검이 1:1로 확실한 새 지역 코드를 자동 반영했습니다. 코드와 표기(label)를 확인해주세요."
            fi
            echo "- **생성 실행**: $RUN_URL"
            echo
            echo "공공데이터포털 국토교통부 실거래가 API 데이터를 파이썬으로 분석해 자동 생성했습니다."
            echo "아래를 확인한 뒤 병합해주세요. 병합되면 main 브랜치 배포 워크플로가 자동으로 GitHub Pages에 배포합니다."
            echo
            echo "### 체크리스트"
            echo "- [ ] 수치/표 내용이 실제와 맞는지 확인"
            echo "- [ ] 차트 이미지가 깨지지 않고 잘 보이는지 확인"
            echo "- [ ] 문장이 어색하거나 과장된 표현이 없는지 확인"
            echo "- [ ] 전자책 홍보 문구가 있다면 자연스러운지 확인"
          } > pr_body.md

      - name: PR 생성
        if: steps.meta.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.meta.outputs.title }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          gh pr create \
            --title "$TITLE" \
            --body-file pr_body.md \
            --base main \
            --head "$BRANCH"

      - name: 지난 미생성 알림 Issue 닫기
        if: success() && steps.meta.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          for num in $(gh issue list --label auto-post-missed --state open --json number -q '.[].number'); do
            gh issue close "$num" --comment "이후 실행에서 글이 정상 생성되어 닫습니다 (브랜치: \`$BRANCH\`)."
          done

      - name: 지역 코드 이상을 Issue로 알림
        # 글 생성 여부와 별개로, 건강 점검에서 코드 이상(모든 코드 0건/폐지 코드)이 나온 날은 따로 알린다.
        if: always() && hashFiles('region_health_report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          KST_DATE="$(date -u -d '+9 hours' +%F)"
          { cat region_health_report.md; echo; echo "- 실행 로그: ${RUN_URL}"; } > region_issue.md
          gh label create region-code-alert --color FBCA04 --description "지역 코드(LAWD_CD) 이상 감지" 2>/dev/null || true
          # 같은 문제로 이미 열린 Issue가 있으면 새로 만들지 않고 댓글로 이어 붙인다.
          EXISTING="$(gh issue list --label region-code-alert --state open --json number -q '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file region_issue.md
          else
            gh issue create --title "[지역 코드 이상] ${KST_DATE} 건강 점검" --body-file region_issue.md --label region-code-alert               || gh issue create --title "[지역 코드 이상] ${KST_DATE} 건강 점검" --body-file region_issue.md
          fi

      - name: 글이 생성되지 않은 사유를 Issue로 알림
        if: always() && (steps.meta.outputs.found != 'true' || failure())
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.meta.outputs.reason }}
          EXIT_CODE: ${{ steps.generate.outputs.exit_code }}
          ATTEMPTS: ${{ steps.generate.outputs.attempts }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          KST_DATE="$(date -u -d '+9 hours' +%F)"
          case "$REASON" in
            no_topic)       REASON_TEXT="발행할 만한 주제 없음 (모든 후보가 데이터/품질 기준 미달 또는 중복)";;
            api_error)      REASON_TEXT="공공데이터 API 오류 (${ATTEMPTS:-?}회 시도 모두 실패)";;
            pipeline_error) REASON_TEXT="콘텐츠 생성 스크립트 오류 (exit=${EXIT_CODE})";;
            *)              REASON_TEXT="워크플로 단계 실패 (설치/브랜치/PR 생성 등 — 실행 로그 확인 필요)";;
          esac
          touch generate_output.log
          {
            echo "## ${KST_DATE} 자동 글 생성: 글이 만들어지지 않았습니다"
            echo
            echo "- **사유**: ${REASON_TEXT}"
            echo "- **트리거**: ${EVENT}"
            echo "- **실행 로그**: ${RUN_URL}"
            echo
            if [ "$REASON" = "no_topic" ]; then
              echo "### 건너뛴 이유"
              echo '```'
              sed -n '/발행할 만한 주제가 없습니다/,$p' generate_output.log | head -n 40
              echo '```'
            else
              echo "### 생성 로그 (마지막 40줄)"
              echo '```'
              tail -n 40 generate_output.log | sed -E 's/serviceKey=[^&[:space:]]+/serviceKey=***/g'
              echo '```'
            fi
            echo
            echo "### 수동으로 다시 생성하기"
            echo "Actions → **데이터 기반 블로그 글 자동 생성 (PR)** → **Run workflow** (또는 \`gh workflow run generate-post.yml\`)."
            echo
            echo "_이 Issue는 이후 실행에서 글이 정상 생성되면 자동으로 닫힙니다._"
          } > issue_body.md
          TITLE="[글 미생성] ${KST_DATE} — ${REASON_TEXT}"
          gh label create auto-post-missed --color D93F0B --description "자동 글 생성이 이루어지지 않은 날" 2>/dev/null || true
          gh issue create --title "$TITLE" --body-file issue_body.md --label auto-post-missed             || gh issue create --title "$TITLE" --body-file issue_body.md

      - name: 생성 실패 시 실행을 실패로 표시
        if: always() && steps.generate.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.generate.outputs.exit_code }}
        run: |
          echo "::error::콘텐츠 생성 단계가 exit=${EXIT_CODE:-미실행}로 끝났습니다. 위 Issue/로그를 확인하세요."
          exit 1
